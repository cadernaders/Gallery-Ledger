name: Build painting index
on:
  workflow_dispatch:
    inputs:
      max_works:
        description: "How many paintings to include"
        default: "16000"
      min_links:
        description: "Least number of Wikipedia languages a painting must be in (lower means more, lesser-known paintings)"
        default: "3"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers pillow requests numpy
      - name: Build the index
        env:
          MAX_WORKS: ${{ github.event.inputs.max_works }}
          MIN_LINKS: ${{ github.event.inputs.min_links }}
        run: python tools/build_index.py
      - name: Save it to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/paintings.json data/paintings.bin
          git commit -m "Update painting index" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - name: Keep a copy as a download too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: painting-index
          path: data/
          if-no-files-found: ignore
